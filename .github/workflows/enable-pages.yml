name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Serve the site from the main branch root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          if gh api "/repos/${repo}/pages" > /tmp/pages.json 2>/tmp/pages.err; then
            echo "Pages site already exists:"
            cat /tmp/pages.json
            gh api --method PUT "/repos/${repo}/pages" \
              -f build_type=legacy \
              -f source[branch]=main \
              -f source[path]=/
          else
            echo "Pages site is not configured yet:"
            cat /tmp/pages.err
            gh api --method POST "/repos/${repo}/pages" \
              -f build_type=legacy \
              -f source[branch]=main \
              -f source[path]=/
          fi
          echo "Pages site after update:"
          gh api "/repos/${repo}/pages"
